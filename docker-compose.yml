services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"  # Изменяем внешний порт на 8001
    environment:
      - DATABASE_URL=postgresql://postgres:PasswordDBWEB2025&@176.108.249.27:5432/psycho
      - UPLOAD_DIR=/app/uploads  # Добавьте эту переменную
      - DOCKER_CONTAINER=true  # Добавьте эту переменную
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"  # Изменяем внешний порт фронтенда на 8080
    depends_on:
      - backend
    restart: unless-stopped