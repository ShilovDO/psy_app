<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Цвета из оригинального логотипа -->
    <style>
      .letter-d { fill: #F2C04C; }
      .letter-p { fill: #1B365D; }
      .wave-line { fill: none; stroke: #E98322; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .wave-dot { fill: #E98322; }
    </style>
  </defs>

  <!-- Фон (прозрачный или белый, как в исходнике) -->
  <rect width="200" height="200" fill="#ffffff" rx="30" />

  <!-- Верхняя волна/линия -->
  <g transform="translate(0, -10)">
    <!-- Основная линия волны -->
    <path class="wave-line" d="M 52 80 C 65 60, 85 55, 100 65 C 115 75, 125 60, 145 75" />
    <!-- Точка на волне -->
    <circle class="wave-dot" cx="112" cy="66" r="8" />
  </g>

  <!-- Буква Д (Золотая) -->
  <!-- Смещена чуть левее и ниже волны -->
  <g transform="translate(-12, 8)">
    <text class="letter-d" x="85" y="135" font-family="'Times New Roman', Georgia, serif" font-size="85" font-weight="bold" text-anchor="middle">Д</text>
  </g>

  <!-- Буква П (Тёмно-синяя) -->
  <!-- Смещена правее -->
  <g transform="translate(12, 8)">
    <text class="letter-p" x="125" y="135" font-family="'Times New Roman', Georgia, serif" font-size="85" font-weight="bold" text-anchor="middle">П</text>
  </g>
</svg>