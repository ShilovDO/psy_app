<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .result-box {
            margin-top: 100px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            text-align: center;
        }
        .result-value {
            font-size: 64px;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="result-box">
                <h1 class="mb-4">Последняя просмотренная картинка №</h1>
                <div id="resultValue" class="result-value">—</div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadResult() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            document.getElementById('resultValue').textContent = 'Нет ID';
            return;
        }

        try {
            const response = await fetch(`/api/results/${id}`);
            if (!response.ok) {
                throw new Error('Ошибка загрузки результата');
            }

            const data = await response.json();

            /*
              Ожидаемый формат ответа:
              {
                  "success": true,
                  "data": {
                      "id": 123,
                      "result": 5
                  }
              }
            */

            if (data.success && data.data) {
                document.getElementById('resultValue').textContent = data.data.result;
            } else {
                document.getElementById('resultValue').textContent = 'Нет данных';
            }

        } catch (error) {
            console.error(error);
            document.getElementById('resultValue').textContent = 'Ошибка';
        }
    }

    document.addEventListener('DOMContentLoaded', loadResult);
</script>

</body>
</html>
