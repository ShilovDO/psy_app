<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .preview {
            width: 150px;
            height: 100px;
            object-fit: cover;
            cursor: grab;
            position: relative;
        }
        .image-box {
            position: relative;
            margin: 10px;
        }
        .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .spinner {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
<div id="loading" class="loading">
    <div class="spinner-border text-primary spinner" role="status">
        <span class="visually-hidden">Загрузка...</span>
    </div>
    <p class="mt-3">Проверка прав доступа...</p>
</div>

<div id="adminPanel" class="container mt-4" style="display: none;">
    <h2>Управление изображениями</h2>
    <input type="file" id="uploadInput" multiple accept="image/*" class="form-control mb-3">
    <div id="imageList" class="d-flex flex-wrap"></div>
    <button id="saveOrderBtn" class="btn btn-success mt-3">💾 Сохранить порядок</button>
</div>

<div id="error" style="display: none;" class="container mt-5">
    <div class="alert alert-danger">
        <h2>Ошибка доступа</h2>
        <p>У вас нет прав для просмотра этой страницы</p>
    </div>
</div>

<script>
    const imageList = document.getElementById('imageList');
    const uploadInput = document.getElementById('uploadInput');
    const saveOrderBtn = document.getElementById('saveOrderBtn');
    const loadingElement = document.getElementById('loading');
    const adminPanel = document.getElementById('adminPanel');
    const errorElement = document.getElementById('error');

    let admin = false;
    let messageReceived = false;
    let images = [];

    // Таймаут ожидания сообщения - 5 секунд
    const messageTimeout = setTimeout(() => {
        if (!messageReceived) {
            showError();
        }
    }, 5000);

    function showAdminPanel() {
        loadingElement.style.display = 'none';
        errorElement.style.display = 'none';
        adminPanel.style.display = 'block';
        fetchImages();
    }

    function showError() {
        messageReceived = true;
        clearTimeout(messageTimeout);
        loadingElement.style.display = 'none';
        adminPanel.style.display = 'none';
        errorElement.style.display = 'block';
    }

    async function fetchImages() {
        try {
            const res = await fetch('/api/images');
            images = await res.json();
            renderImages();
        } catch (error) {
            console.error('Ошибка загрузки изображений:', error);
        }
    }

    function renderImages() {
        imageList.innerHTML = '';
        images.forEach(name => {
            const div = document.createElement('div');
            div.className = 'image-box';
            div.draggable = true;
            div.dataset.name = name;

            const img = document.createElement('img');
            img.src = `/images/${name}?t=${Date.now()}`;
            img.className = 'preview';

            const btn = document.createElement('button');
            btn.className = 'remove-btn';
            btn.innerText = '×';
            btn.onclick = async () => {
                try {
                    await fetch(`/api/delete/${name}`, { method: 'DELETE' });
                    fetchImages();
                } catch (error) {
                    console.error('Ошибка удаления изображения:', error);
                }
            };

            div.appendChild(img);
            div.appendChild(btn);
            imageList.appendChild(div);
        });
        enableDragDrop();
    }

    uploadInput.addEventListener('change', async () => {
        try {
            const formData = new FormData();
            for (const file of uploadInput.files) {
                formData.append('images', file);
            }
            await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            uploadInput.value = '';
            fetchImages();
        } catch (error) {
            console.error('Ошибка загрузки файлов:', error);
        }
    });

    window.addEventListener('message', function(event) {
        messageReceived = true;
        clearTimeout(messageTimeout);

        if (event.data === 'secret_key') {
            admin = true;
            showAdminPanel();
        } else {
            showError();
        }
    });

    saveOrderBtn.addEventListener('click', async () => {
        try {
            const ordered = [...imageList.children].map(div => div.dataset.name);
            await fetch('/api/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ordered)
            });
            fetchImages();
        } catch (error) {
            console.error('Ошибка сохранения порядка:', error);
        }
    });

    function enableDragDrop() {
        let dragging;

        imageList.querySelectorAll('.image-box').forEach(item => {
            item.addEventListener('dragstart', () => dragging = item);
            item.addEventListener('dragover', e => e.preventDefault());
            item.addEventListener('drop', e => {
                if (dragging && dragging !== item) {
                    imageList.insertBefore(dragging, item);
                }
            });
        });
    }
</script>
</body>
</html>
