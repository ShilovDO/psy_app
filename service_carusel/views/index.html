<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карусель изображений</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            max-height: 600px;
            width: auto;
            height: auto;
            object-fit: contain;
            background-color: #f8f8f8;
        }
        
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(100%);
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <!-- Заголовок страницы -->
    <div id="pageHeader" class="page-header">
        <h1 id="configTitle">Карусель изображений</h1>
    </div>
    
<div class="carousel-container">
    <div id="carousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="carouselInner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
    <!-- Счётчик текущей картинки -->
    <div id="carouselCounter" class="text-center mt-2"></div>
</div>

<script>
    // Функция отправки текущего слайда на сервер
    async function sendCurrentSlideToServer(slideNumber) {
        try {
            await fetch('/api/set_result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ result: slideNumber })
            });
            console.log('Текущий слайд отправлен на сервер:', slideNumber);
        } catch (error) {
            console.error('Ошибка отправки слайда на сервер:', error);
        }
    }

    async function initCarousel() {
        // Получаем ID из параметра URL
        const urlParams = new URLSearchParams(window.location.search);
        const platformId = urlParams.get('id');
        
        // Если есть ID - загружаем конфигурацию и устанавливаем заголовок
        if (platformId) {
            try {
                const configRes = await fetch(`/api/config/${platformId}`);
                if (configRes.ok) {
                    const configData = await configRes.json();
                    if (configData.success && configData.data && configData.data.test) {
                        // Устанавливаем текст как заголовок на странице
                        document.getElementById('configTitle').textContent = configData.data.test;
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки конфигурации:', error);
            }
        }
        
        // Загружаем изображения для карусели
        try {
            const imagesRes = await fetch('/api/images');
            const images = await imagesRes.json();
            const inner = document.getElementById('carouselInner');
            inner.innerHTML = '';

            images.forEach((img, i) => {
                const item = document.createElement('div');
                item.className = `carousel-item ${i === 0 ? 'active' : ''}`;
                const image = document.createElement('img');
                image.src = `/images/${img}`;
                image.className = 'd-block w-100';
                image.alt = `Image ${i + 1}`;
                item.appendChild(image);
                inner.appendChild(item);
            });

            // Элемент счётчика
            const counter = document.getElementById('carouselCounter');

            // Функция обновления счётчика и отправки на сервер
            const updateCounter = () => {
                const activeIndex = [...inner.children].findIndex(item => item.classList.contains('active'));
                counter.textContent = `${activeIndex + 1} / ${images.length}`;

                // Отправляем номер текущего слайда на сервер
                sendCurrentSlideToServer(activeIndex + 1);
            };

            // Инициализируем счётчик при загрузке
            updateCounter();

            // Отслеживаем смену слайда
            const carouselEl = document.getElementById('carousel');
            carouselEl.addEventListener('slid.bs.carousel', updateCounter);

        } catch (error) {
            console.error('Ошибка загрузки изображений:', error);
        }
    }

    // Запускаем при загрузке страницы
    document.addEventListener('DOMContentLoaded', initCarousel);
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
